[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reporeview-arena"
version = "0.1.0"
description = "Independent multi-LLM repository audit competition with evidence-first scoring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "RepoReview Arena Contributors"}]
dependencies = []

[project.optional-dependencies]
llm = ["litellm>=1.70,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
reporeview = "reporeview_arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
